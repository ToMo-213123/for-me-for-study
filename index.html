<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>公民問題集 - 裁判所・国会 全網羅</title>
<style>
:root {
  --bg: #f5f7fb;
  --card: #ffffff;
  --primary: #2c5282;
  --primary-light: #ebf2fb;
  --accent: #dd6b20;
  --accent-light: #fef5e7;
  --success: #2f855a;
  --success-light: #f0fff4;
  --danger: #c53030;
  --danger-light: #fff5f5;
  --muted: #718096;
  --border: #e2e8f0;
  --text: #1a202c;
  --shadow: 0 1px 3px rgba(0,0,0,0.06), 0 1px 2px rgba(0,0,0,0.04);
  --shadow-md: 0 4px 6px rgba(0,0,0,0.05), 0 2px 4px rgba(0,0,0,0.04);
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.7;
  padding: 0;
  min-height: 100vh;
}
header {
  background: linear-gradient(135deg, var(--primary) 0%, #1a365d 100%);
  color: white;
  padding: 24px 20px;
  box-shadow: var(--shadow-md);
  position: sticky;
  top: 0;
  z-index: 100;
}
header .container {
  max-width: 880px;
  margin: 0 auto;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  flex-wrap: wrap;
}
header h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: 0.02em;
}
header .subtitle {
  font-size: 13px;
  opacity: 0.85;
  margin-top: 4px;
}
header .stats {
  font-size: 13px;
  background: rgba(255,255,255,0.15);
  padding: 6px 12px;
  border-radius: 6px;
  white-space: nowrap;
}
main {
  max-width: 880px;
  margin: 0 auto;
  padding: 24px 16px 60px;
}

/* === スタート画面 === */
.screen-start {
  background: var(--card);
  border-radius: 12px;
  padding: 32px 24px;
  box-shadow: var(--shadow);
}
.screen-start h2 {
  font-size: 20px;
  margin-bottom: 8px;
  color: var(--primary);
}
.screen-start p.lead {
  color: var(--muted);
  margin-bottom: 24px;
  font-size: 14px;
}
.section-label {
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  text-transform: uppercase;
  letter-spacing: 0.06em;
  margin: 24px 0 10px;
}
.option-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
  gap: 10px;
}
.option-card {
  border: 2px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  cursor: pointer;
  transition: all 0.15s ease;
  background: white;
  text-align: center;
  user-select: none;
}
.option-card:hover { border-color: var(--primary); background: var(--primary-light); }
.option-card.selected {
  border-color: var(--primary);
  background: var(--primary-light);
  box-shadow: 0 0 0 3px rgba(44,82,130,0.1);
}
.option-card .icon { font-size: 24px; margin-bottom: 6px; display:block; }
.option-card .title { font-weight: 700; font-size: 15px; }
.option-card .desc { font-size: 12px; color: var(--muted); margin-top: 4px; }

.wrong-only-card {
  border: 2px solid var(--border);
  border-radius: 8px;
  padding: 16px;
  background: var(--accent-light);
  cursor: pointer;
  transition: all 0.15s ease;
}
.wrong-only-card.disabled {
  opacity: 0.5;
  cursor: not-allowed;
}
.wrong-only-card .title { font-weight: 700; color: var(--accent); }
.wrong-only-card .desc { font-size: 12px; color: var(--muted); margin-top: 4px; }

.btn-start {
  display: block;
  width: 100%;
  margin-top: 24px;
  background: var(--primary);
  color: white;
  border: none;
  padding: 16px 24px;
  font-size: 16px;
  font-weight: 700;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s ease;
}
.btn-start:hover { background: #1a365d; }
.btn-start:disabled { background: #a0aec0; cursor: not-allowed; }

.btn-reset {
  display: block;
  width: 100%;
  margin-top: 8px;
  background: transparent;
  color: var(--danger);
  border: 1px solid var(--border);
  padding: 10px;
  font-size: 13px;
  border-radius: 8px;
  cursor: pointer;
}
.btn-reset:hover { background: var(--danger-light); }

/* === 問題画面 === */
.quiz-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
  flex-wrap: wrap;
  gap: 8px;
}
.quiz-progress {
  font-size: 13px;
  color: var(--muted);
}
.quiz-progress .num { color: var(--primary); font-weight: 700; }
.progress-bar {
  height: 6px;
  background: var(--border);
  border-radius: 3px;
  overflow: hidden;
  margin-bottom: 16px;
}
.progress-bar > div {
  height: 100%;
  background: var(--primary);
  transition: width 0.3s ease;
}
.quiz-card {
  background: var(--card);
  border-radius: 12px;
  padding: 28px 24px;
  box-shadow: var(--shadow);
  margin-bottom: 16px;
}
.quiz-meta {
  display: flex;
  gap: 6px;
  margin-bottom: 12px;
  flex-wrap: wrap;
}
.tag {
  font-size: 11px;
  padding: 3px 10px;
  border-radius: 12px;
  background: var(--primary-light);
  color: var(--primary);
  font-weight: 600;
}
.tag.sub {
  background: var(--accent-light);
  color: var(--accent);
}
.question-text {
  font-size: 16px;
  margin-bottom: 20px;
  line-height: 2.0;
}
.blank-input {
  display: inline-flex;
  flex-direction: column;
  align-items: stretch;
  min-width: 120px;
  margin: 0 4px;
  vertical-align: baseline;
  position: relative;
  top: 4px;
}
.blank-input input {
  width: 100%;
  padding: 2px 8px;
  border: 2px solid var(--primary);
  border-radius: 4px;
  font-size: 15px;
  background: var(--primary-light);
  font-family: inherit;
  color: var(--primary);
  font-weight: 600;
  text-align: center;
  line-height: 1.6;
  height: 1.9em;
}
.blank-input input::placeholder {
  color: #a0aec0;
  font-weight: 400;
}
.blank-input input:focus {
  outline: none;
  border-color: var(--accent);
  background: white;
  box-shadow: 0 0 0 2px rgba(221,107,32,0.15);
}
.blank-input.answered.correct input {
  border-color: var(--success);
  background: var(--success-light);
  color: var(--success);
}
.blank-input.answered.wrong input {
  border-color: var(--danger);
  background: var(--danger-light);
  color: var(--danger);
}
.blank-hint {
  display: block;
  font-size: 11px;
  color: #666;
  margin-top: 3px;
  text-align: center;
  background: #fff8e1;
  padding: 2px 6px;
  border-radius: 3px;
  border: 1px dashed #ffd54f;
  line-height: 1.4;
}
.choices {
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.choice {
  border: 2px solid var(--border);
  border-radius: 8px;
  padding: 14px 16px;
  cursor: pointer;
  transition: all 0.15s ease;
  display: flex;
  align-items: center;
  gap: 12px;
  background: white;
  user-select: none;
}
.choice:hover { border-color: var(--primary); background: var(--primary-light); }
.choice .marker {
  width: 26px;
  height: 26px;
  border-radius: 50%;
  border: 2px solid var(--border);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 700;
  color: var(--muted);
  flex-shrink: 0;
}
.choice.selected { border-color: var(--primary); background: var(--primary-light); }
.choice.selected .marker { background: var(--primary); color: white; border-color: var(--primary); }
.choice.correct { border-color: var(--success); background: var(--success-light); }
.choice.correct .marker { background: var(--success); color: white; border-color: var(--success); }
.choice.wrong { border-color: var(--danger); background: var(--danger-light); }
.choice.wrong .marker { background: var(--danger); color: white; border-color: var(--danger); }
.choice .label { font-size: 15px; }

.feedback {
  margin-top: 16px;
  padding: 14px 16px;
  border-radius: 8px;
  font-size: 14px;
  display: none;
}
.feedback.show { display: block; }
.feedback.correct {
  background: var(--success-light);
  border-left: 4px solid var(--success);
  color: var(--success);
}
.feedback.wrong {
  background: var(--danger-light);
  border-left: 4px solid var(--danger);
  color: var(--danger);
}
.feedback .answer-line { font-weight: 700; margin-bottom: 4px; }
.feedback .explanation { color: var(--text); margin-top: 6px; font-size: 13px; }

.quiz-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.btn {
  flex: 1;
  padding: 14px 20px;
  border: none;
  border-radius: 8px;
  font-size: 15px;
  font-weight: 600;
  cursor: pointer;
  transition: all 0.15s ease;
}
.btn-primary { background: var(--primary); color: white; }
.btn-primary:hover { background: #1a365d; }
.btn-primary:disabled { background: #cbd5e0; cursor: not-allowed; box-shadow: none; }
.btn-secondary { background: white; color: var(--primary); border: 2px solid var(--border); }
.btn-secondary:hover { border-color: var(--primary); background: var(--primary-light); }

/* === 結果画面 === */
.screen-result {
  background: var(--card);
  border-radius: 12px;
  padding: 32px 24px;
  box-shadow: var(--shadow);
  text-align: center;
}
.result-icon {
  font-size: 56px;
  margin-bottom: 8px;
}
.result-score {
  font-size: 48px;
  font-weight: 700;
  color: var(--primary);
  margin: 8px 0;
}
.result-score small { font-size: 20px; color: var(--muted); font-weight: 500; }
.result-msg {
  color: var(--muted);
  margin-bottom: 24px;
  font-size: 14px;
}
.result-detail {
  background: var(--bg);
  border-radius: 8px;
  padding: 16px;
  margin: 16px 0;
  text-align: left;
  font-size: 13px;
}
.result-detail .row {
  display: flex;
  justify-content: space-between;
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}
.result-detail .row:last-child { border-bottom: none; }
.result-detail .row .label { color: var(--muted); }
.result-detail .row .val { font-weight: 700; }
.result-actions {
  display: flex;
  gap: 10px;
  margin-top: 20px;
  flex-wrap: wrap;
}

.wrong-list {
  text-align: left;
  margin-top: 20px;
  border-top: 1px solid var(--border);
  padding-top: 16px;
}
.wrong-list h3 { font-size: 14px; color: var(--danger); margin-bottom: 10px; }
.wrong-list ul { list-style: none; }
.wrong-list li {
  font-size: 13px;
  padding: 6px 0;
  border-bottom: 1px dashed var(--border);
  color: var(--muted);
}
.wrong-list li:last-child { border: none; }

.hidden { display: none !important; }

@media (max-width: 640px) {
  header h1 { font-size: 18px; }
  .quiz-card { padding: 20px 16px; }
  .question-text { font-size: 15px; }
  .blank-input { min-width: 90px; }
  .choice { padding: 12px; }
  .choice .label { font-size: 14px; }
}
</style>
</head>
<body>
<header>
  <div class="container">
    <div>
      <h1>公民問題集 - 裁判所・国会 全網羅</h1>
      <div class="subtitle">中3公民 政治分野 / 書込み式・選択式 / ランダム出題</div>
    </div>
    <div class="stats" id="header-stats">問題数: 0</div>
  </div>
</header>
<main>
  <!-- スタート画面 -->
  <div id="screen-start" class="screen-start">
    <h2>学習を始めよう</h2>
    <p class="lead">範囲を選んで「開始」を押してください。空欄位置・選択肢順序は毎回ランダムに変わります。</p>

    <div class="section-label">出題範囲</div>
    <div class="option-grid" id="cat-options">
      <div class="option-card selected" data-cat="all"><span class="icon">📚</span><div class="title">全範囲</div><div class="desc">裁判所 + 国会</div></div>
      <div class="option-card" data-cat="裁判所"><span class="icon">⚖️</span><div class="title">裁判所</div><div class="desc">司法・刑事手続き・死刑制度など</div></div>
      <div class="option-card" data-cat="国会"><span class="icon">🏛️</span><div class="title">国会</div><div class="desc">二院制・国会機能・衆院優越など</div></div>
    </div>

    <div class="section-label">出題モード</div>
    <div class="option-grid">
      <div class="option-card selected" data-mode="all"><span class="icon">📝</span><div class="title">全問を解く</div><div class="desc">選択範囲の全問題</div></div>
      <div class="wrong-only-card disabled" id="mode-wrong-card">
        <div class="title">⚠️ 前回間違えた問題だけ</div>
        <div class="desc" id="wrong-count-desc">間違えた問題はありません</div>
      </div>
    </div>

    <button class="btn-start" id="btn-start">学習を開始する</button>
    <button class="btn-reset" id="btn-reset">履歴をクリア</button>
  </div>

  <!-- 問題画面 -->
  <div id="screen-quiz" class="hidden">
    <div class="quiz-header">
      <div class="quiz-progress">問題 <span class="num" id="cur-num">1</span> / <span id="total-num">10</span></div>
      <div class="quiz-progress" id="score-display">◯ <span id="ok-count">0</span> / ✗ <span id="ng-count">0</span></div>
    </div>
    <div class="progress-bar"><div id="progress-fill" style="width: 0%"></div></div>
    <div class="quiz-card" id="quiz-card">
      <!-- 問題は動的に挿入 -->
    </div>
    <div class="quiz-actions">
      <button class="btn btn-secondary" id="btn-quit">中止</button>
      <button class="btn btn-primary" id="btn-next" disabled>解答する</button>
    </div>
  </div>

  <!-- 結果画面 -->
  <div id="screen-result" class="screen-result hidden">
    <div class="result-icon" id="result-icon">🎯</div>
    <h2 id="result-title">お疲れさまでした!</h2>
    <div class="result-score"><span id="result-correct">0</span><small> / <span id="result-total">0</span> 問正解</small></div>
    <div class="result-msg" id="result-msg"></div>
    <div class="result-detail" id="result-detail"></div>
    <div class="result-actions">
      <button class="btn btn-primary" id="btn-retry-wrong">間違えた問題だけ</button>
      <button class="btn btn-secondary" id="btn-retry-all">全問もう一度</button>
      <button class="btn btn-secondary" id="btn-back-home">スタートに戻る</button>
    </div>
    <div class="wrong-list" id="wrong-list"></div>
  </div>
</main>

// ============================================================
// 状態管理
// ============================================================
const STORAGE_KEY_WRONG = 'comin_quiz_wrong_ids_v1';
const STORAGE_KEY_TOTAL = 'comin_quiz_total_v1';

let state = {
  selectedCat: 'all',
  selectedMode: 'all',
  quizQuestions: [],
  currentIndex: 0,
  correctCount: 0,
  wrongCount: 0,
  wrongThisRound: [],
  answered: false,
  currentAnswer: null
};

// ============================================================
// ユーティリティ
// ============================================================
function shuffleArray(arr) {
  const a = arr.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function normalizeAnswer(s) {
  return String(s).trim().replace(/\s+/g, '').replace(/[　]/g, '');
}

function loadWrongIds() {
  try {
    return JSON.parse(localStorage.getItem(STORAGE_KEY_WRONG) || '[]');
  } catch { return []; }
}
function saveWrongIds(ids) {
  localStorage.setItem(STORAGE_KEY_WRONG, JSON.stringify(ids));
}
function addToWrong(qid) {
  const ids = loadWrongIds();
  if (!ids.includes(qid)) {
    ids.push(qid);
    saveWrongIds(ids);
  }
}
function removeFromWrong(qid) {
  const ids = loadWrongIds().filter(x => x !== qid);
  saveWrongIds(ids);
}
function clearWrong() {
  localStorage.removeItem(STORAGE_KEY_WRONG);
  localStorage.removeItem(STORAGE_KEY_TOTAL);
}

// ============================================================
// スタート画面
// ============================================================
function renderStartScreen() {
  const wrongIds = loadWrongIds();
  const wrongCard = document.getElementById('mode-wrong-card');
  const wrongDesc = document.getElementById('wrong-count-desc');
  if (wrongIds.length === 0) {
    wrongCard.classList.add('disabled');
    wrongDesc.textContent = '間違えた問題はありません';
    if (state.selectedMode === 'wrong') {
      state.selectedMode = 'all';
      document.querySelectorAll('[data-mode]').forEach(c => c.classList.remove('selected'));
      document.querySelector('[data-mode="all"]').classList.add('selected');
    }
  } else {
    wrongCard.classList.remove('disabled');
    wrongDesc.textContent = `${wrongIds.length} 問あります`;
  }
  document.getElementById('header-stats').textContent = `総問題数: ${ALL_QUESTIONS.length}`;
}

document.getElementById('cat-options').addEventListener('click', e => {
  const card = e.target.closest('.option-card');
  if (!card) return;
  document.querySelectorAll('#cat-options .option-card').forEach(c => c.classList.remove('selected'));
  card.classList.add('selected');
  state.selectedCat = card.dataset.cat;
});

document.querySelectorAll('[data-mode]').forEach(el => {
  el.addEventListener('click', () => {
    if (el.id === 'mode-wrong-card' && el.classList.contains('disabled')) return;
    document.querySelectorAll('[data-mode]').forEach(c => c.classList.remove('selected'));
    el.classList.add('selected');
    state.selectedMode = el.dataset.mode || (el.id === 'mode-wrong-card' ? 'wrong' : 'all');
  });
});

document.getElementById('btn-start').addEventListener('click', startQuiz);
document.getElementById('btn-reset').addEventListener('click', () => {
  if (confirm('学習履歴(間違えた問題リスト)をクリアしますか?')) {
    clearWrong();
    renderStartScreen();
  }
});

// ============================================================
// クイズ開始
// ============================================================
function startQuiz() {
  let pool = ALL_QUESTIONS.slice();
  if (state.selectedCat !== 'all') {
    pool = pool.filter(q => q.cat === state.selectedCat);
  }
  if (state.selectedMode === 'wrong') {
    const wrongIds = loadWrongIds();
    pool = pool.filter(q => wrongIds.includes(q.id));
    // 間違えた問題を正解したらリストから消すための記録
  }
  if (pool.length === 0) {
    alert('出題できる問題がありません。');
    return;
  }
  state.quizQuestions = shuffleArray(pool);
  state.currentIndex = 0;
  state.correctCount = 0;
  state.wrongCount = 0;
  state.wrongThisRound = [];
  showScreen('quiz');
  renderQuestion();
}

function showScreen(name) {
  document.getElementById('screen-start').classList.add('hidden');
  document.getElementById('screen-quiz').classList.add('hidden');
  document.getElementById('screen-result').classList.add('hidden');
  document.getElementById('screen-' + name).classList.remove('hidden');
}

// ============================================================
// 問題描画
// ============================================================
function renderQuestion() {
  const q = state.quizQuestions[state.currentIndex];
  state.answered = false;
  state.currentAnswer = null;
  document.getElementById('cur-num').textContent = state.currentIndex + 1;
  document.getElementById('total-num').textContent = state.quizQuestions.length;
  document.getElementById('ok-count').textContent = state.correctCount;
  document.getElementById('ng-count').textContent = state.wrongCount;
  document.getElementById('progress-fill').style.width = `${(state.currentIndex / state.quizQuestions.length) * 100}%`;

  const card = document.getElementById('quiz-card');
  card.innerHTML = '';

  // メタ
  const meta = document.createElement('div');
  meta.className = 'quiz-meta';
  meta.innerHTML = `<span class="tag">${q.cat}</span><span class="tag sub">${q.sub}</span>`;
  card.appendChild(meta);

  if (q.type === 'fill') {
    renderFillQuestion(card, q);
  } else {
    renderChoiceQuestion(card, q);
  }

  // フィードバック領域
  const fb = document.createElement('div');
  fb.className = 'feedback';
  fb.id = 'feedback';
  card.appendChild(fb);

  const btnNext = document.getElementById('btn-next');
  btnNext.textContent = '解答する';
  btnNext.disabled = true;
}

function renderFillQuestion(card, q) {
  const text = document.createElement('div');
  text.className = 'question-text';
  // ランダムに空欄にする箇所を選ぶ: 全ブランクのうち1〜2個を空欄に
  const blankIndices = [];
  q.segments.forEach((s, i) => { if (typeof s === 'object' && s.b) blankIndices.push(i); });
  // 1問あたり最低1個、最大2個空欄 (ブランクが3つ以上なら2個、それ以下は全て)
  let numBlanks = 1;
  if (blankIndices.length >= 3) numBlanks = 2;
  if (blankIndices.length >= 5) numBlanks = 3;
  const shuffled = shuffleArray(blankIndices);
  const chosenBlanks = new Set(shuffled.slice(0, numBlanks));

  const blankData = []; // {id, answer, inputEl}

  q.segments.forEach((seg, i) => {
    if (typeof seg === 'string') {
      text.appendChild(document.createTextNode(seg));
    } else {
      // blank candidate
      if (chosenBlanks.has(i)) {
        const wrap = document.createElement('span');
        wrap.className = 'blank-input';
        const input = document.createElement('input');
        input.type = 'text';
        input.dataset.answer = seg.b;
        input.placeholder = '?';
        input.autocomplete = 'off';
        input.addEventListener('input', () => {
          // 全ての空欄に何か入っていれば「解答する」有効化
          const inputs = card.querySelectorAll('.blank-input input');
          const allFilled = Array.from(inputs).every(x => x.value.trim() !== '');
          document.getElementById('btn-next').disabled = !allFilled;
        });
        input.addEventListener('keydown', e => {
          if (e.key === 'Enter' && !document.getElementById('btn-next').disabled) {
            document.getElementById('btn-next').click();
          }
        });
        wrap.appendChild(input);
        if (seg.h) {
          const hint = document.createElement('span');
          hint.className = 'blank-hint';
          hint.textContent = '💡 ' + seg.h;
          wrap.appendChild(hint);
        }
        text.appendChild(wrap);
        blankData.push({ input, answer: seg.b });
      } else {
        // 答えをそのまま表示
        const span = document.createElement('span');
        span.style.fontWeight = '700';
        span.style.color = 'var(--primary)';
        span.style.background = 'var(--primary-light)';
        span.style.padding = '2px 6px';
        span.style.borderRadius = '4px';
        span.textContent = seg.b;
        text.appendChild(span);
      }
    }
  });
  card.appendChild(text);

  // ブランク情報を保存
  state.currentAnswer = { type: 'fill', blanks: blankData };
  // フォーカス
  setTimeout(() => { if (blankData[0]) blankData[0].input.focus(); }, 50);
}

function renderChoiceQuestion(card, q) {
  const text = document.createElement('div');
  text.className = 'question-text';
  text.textContent = q.question;
  card.appendChild(text);

  const choicesWrap = document.createElement('div');
  choicesWrap.className = 'choices';

  // 選択肢をシャッフル
  const indexed = q.choices.map((c, i) => ({ text: c, isCorrect: i === q.correct }));
  const shuffled = shuffleArray(indexed);

  shuffled.forEach((ch, idx) => {
    const div = document.createElement('div');
    div.className = 'choice';
    div.dataset.correct = ch.isCorrect;
    const marker = document.createElement('div');
    marker.className = 'marker';
    marker.textContent = ['ア','イ','ウ','エ','オ','カ'][idx] || (idx+1);
    const label = document.createElement('div');
    label.className = 'label';
    label.textContent = ch.text;
    div.appendChild(marker);
    div.appendChild(label);
    div.addEventListener('click', () => {
      if (state.answered) return;
      choicesWrap.querySelectorAll('.choice').forEach(c => c.classList.remove('selected'));
      div.classList.add('selected');
      state.currentAnswer = { type: 'choice', selectedDiv: div, isCorrect: ch.isCorrect };
      document.getElementById('btn-next').disabled = false;
    });
    choicesWrap.appendChild(div);
  });
  card.appendChild(choicesWrap);
}

// ============================================================
// 解答処理
// ============================================================
document.getElementById('btn-next').addEventListener('click', () => {
  if (!state.answered) {
    // 解答を採点
    submitAnswer();
  } else {
    // 次の問題へ
    nextQuestion();
  }
});

function submitAnswer() {
  state.answered = true;
  const q = state.quizQuestions[state.currentIndex];
  const fb = document.getElementById('feedback');
  const btnNext = document.getElementById('btn-next');
  let isCorrect = false;
  let userAnswerStr = '';
  let correctAnswerStr = '';

  if (state.currentAnswer.type === 'fill') {
    const blanks = state.currentAnswer.blanks;
    let allCorrect = true;
    const correctParts = [];
    const userParts = [];
    blanks.forEach(b => {
      const user = normalizeAnswer(b.input.value);
      const correct = normalizeAnswer(b.answer);
      const wrap = b.input.closest('.blank-input');
      if (user === correct) {
        wrap.classList.add('answered', 'correct');
      } else {
        wrap.classList.add('answered', 'wrong');
        allCorrect = false;
      }
      userParts.push(user);
      correctParts.push(b.answer);
    });
    isCorrect = allCorrect;
    userAnswerStr = userParts.join(' / ');
    correctAnswerStr = correctParts.join(' / ');
  } else if (state.currentAnswer.type === 'choice') {
    const selDiv = state.currentAnswer.selectedDiv;
    if (state.currentAnswer.isCorrect) {
      selDiv.classList.add('correct');
      isCorrect = true;
      userAnswerStr = selDiv.querySelector('.label').textContent;
    } else {
      selDiv.classList.add('wrong');
      // 正解の選択肢もハイライト
      document.querySelectorAll('.choice').forEach(c => {
        if (c.dataset.correct === 'true') c.classList.add('correct');
      });
      userAnswerStr = selDiv.querySelector('.label').textContent;
    }
    document.querySelectorAll('.choice').forEach(c => c.style.pointerEvents = 'none');
    correctAnswerStr = q.choices[q.correct];
  }

  if (isCorrect) {
    state.correctCount++;
    fb.className = 'feedback show correct';
    fb.innerHTML = '<div class="answer-line">✓ 正解!</div>';
    // 間違えた問題リストから削除
    removeFromWrong(q.id);
  } else {
    state.wrongCount++;
    state.wrongThisRound.push({ id: q.id, q, userAnswer: userAnswerStr, correctAnswer: correctAnswerStr });
    addToWrong(q.id);
    let explHtml = '';
    if (q.explanation) explHtml = `<div class="explanation">📝 ${q.explanation}</div>`;
    if (state.currentAnswer.type === 'fill') {
      // 全ブランクの正解を表示
      const allBlanks = q.segments.filter(s => typeof s === 'object' && s.b).map(s => s.b);
      const userBlanks = state.currentAnswer.blanks.map(b => normalizeAnswer(b.input.value));
      fb.className = 'feedback show wrong';
      fb.innerHTML = `
        <div class="answer-line">✗ 不正解</div>
        <div class="explanation">あなたの答え: ${userAnswerStr}<br>正解: ${correctAnswerStr}</div>
        ${explHtml}
      `;
    } else {
      fb.className = 'feedback show wrong';
      fb.innerHTML = `
        <div class="answer-line">✗ 不正解</div>
        <div class="explanation">あなたの答え: ${userAnswerStr}<br>正解: ${correctAnswerStr}</div>
        ${explHtml}
      `;
    }
  }

  btnNext.textContent = (state.currentIndex + 1 < state.quizQuestions.length) ? '次の問題へ →' : '結果を見る';
  btnNext.disabled = false;

  // スコア更新
  document.getElementById('ok-count').textContent = state.correctCount;
  document.getElementById('ng-count').textContent = state.wrongCount;
}

function nextQuestion() {
  if (state.currentIndex + 1 < state.quizQuestions.length) {
    state.currentIndex++;
    renderQuestion();
  } else {
    showResult();
  }
}

// ============================================================
// 結果画面
// ============================================================
function showResult() {
  document.getElementById('progress-fill').style.width = '100%';
  showScreen('result');
  const total = state.quizQuestions.length;
  const correct = state.correctCount;
  const wrong = state.wrongCount;
  document.getElementById('result-correct').textContent = correct;
  document.getElementById('result-total').textContent = total;

  const pct = total > 0 ? Math.round((correct / total) * 100) : 0;
  let icon, msg;
  if (pct === 100) { icon = '🏆'; msg = '全問正解!完璧です!'; }
  else if (pct >= 80) { icon = '🌟'; msg = '素晴らしい!あと少しです。'; }
  else if (pct >= 60) { icon = '👍'; msg = 'よく頑張りました。間違えた問題を復習しましょう。'; }
  else if (pct >= 40) { icon = '💪'; msg = 'もう一度範囲を見直してみましょう。'; }
  else { icon = '📚'; msg = '学習をやり直して、もう一度挑戦してみましょう。'; }
  document.getElementById('result-icon').textContent = icon;
  document.getElementById('result-msg').textContent = msg;

  document.getElementById('result-detail').innerHTML = `
    <div class="row"><span class="label">出題数</span><span class="val">${total} 問</span></div>
    <div class="row"><span class="label">正解</span><span class="val" style="color:var(--success)">${correct} 問</span></div>
    <div class="row"><span class="label">不正解</span><span class="val" style="color:var(--danger)">${wrong} 問</span></div>
    <div class="row"><span class="label">正答率</span><span class="val">${pct} %</span></div>
  `;

  // 間違えた問題リスト表示
  const wrongListEl = document.getElementById('wrong-list');
  if (state.wrongThisRound.length > 0) {
    let html = '<h3>今回間違えた問題</h3><ul>';
    state.wrongThisRound.forEach(w => {
      const qText = w.q.type === 'fill'
        ? w.q.segments.map(s => typeof s === 'string' ? s : `【${s.b}】`).join('')
        : w.q.question;
      const shortText = qText.length > 80 ? qText.slice(0, 80) + '…' : qText;
      html += `<li>[${w.q.cat} / ${w.q.sub}] ${shortText}<br>→ 正解: <b>${w.correctAnswer}</b></li>`;
    });
    html += '</ul>';
    wrongListEl.innerHTML = html;
    document.getElementById('btn-retry-wrong').style.display = '';
  } else {
    wrongListEl.innerHTML = '';
    document.getElementById('btn-retry-wrong').style.display = 'none';
  }
}

document.getElementById('btn-retry-wrong').addEventListener('click', () => {
  state.selectedMode = 'wrong';
  startQuiz();
});
document.getElementById('btn-retry-all').addEventListener('click', () => {
  state.selectedMode = 'all';
  startQuiz();
});
document.getElementById('btn-back-home').addEventListener('click', () => {
  renderStartScreen();
  showScreen('start');
});
document.getElementById('btn-quit').addEventListener('click', () => {
  if (confirm('学習を中止してスタート画面に戻りますか?')) {
    renderStartScreen();
    showScreen('start');
  }
});

// 初期化
renderStartScreen();
</script>
